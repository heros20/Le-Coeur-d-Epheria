<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="screen-orientation" content="landscape" />
    <meta name="x5-orientation" content="landscape" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="full-screen" content="yes" />
    <title>Le Cœur d’Éphéria</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- COQUE DE CONSOLE -->
    <div class="console-root">
      <div class="console-shell">
        <div class="console-screen">
          <!-- ÉCRAN DE JEU (CACHÉ AU DÉBUT) -->
          <div id="game" class="hidden">
            <div class="game-layout">
              <!-- Zone de jeu -->
              <div class="game-viewport">
                <canvas id="gameCanvas" width="1024" height="768"></canvas>

                <!-- Overlays directement sur le canvas -->
                <div id="dialogue" class="dialogue hidden">
                  <div class="box">
                    <div id="dialogueSpeaker"></div>
                    <div id="dialogueText"></div>
                    <button id="dialogueNext">⮕</button>
                  </div>
                </div>

                <div id="ending" class="ending hidden"></div>

                <!-- CONTRÔLES MOBILES DANS LA ZONE DE JEU -->
                <div id="mobile-controls" class="touch-controls">
                  <!-- D-Pad en croix, sans cercle central -->
                  <div class="touch-dpad">
                    <button
                      id="btn-up"
                      class="touch-btn dpad-btn dpad-up"
                    ></button>
                    <button
                      id="btn-left"
                      class="touch-btn dpad-btn dpad-left"
                    ></button>
                    <button
                      id="btn-right"
                      class="touch-btn dpad-btn dpad-right"
                    ></button>
                    <button
                      id="btn-down"
                      class="touch-btn dpad-btn dpad-down"
                    ></button>
                  </div>

                  <!-- Boutons d’action -->
                  <div class="touch-buttons actions-pad">
                    <button
                      id="btn-interact"
                      class="touch-btn touch-interact action-btn action-top"
                    >
                      <span class="btn-label">Interagir</span>
                    </button>

                    <button
                      id="btn-attack"
                      class="touch-btn touch-attack action-btn action-left"
                    >
                      <span class="btn-label">Attaque</span>
                    </button>

                    <button
                      id="btn-dash"
                      class="touch-btn touch-dash action-btn action-right"
                    >
                      <span class="btn-label">Dash</span>
                      <span
                        class="cooldown-text"
                        aria-hidden="true"
                      ></span>
                    </button>

                    <button
                      id="btn-sprint"
                      class="touch-btn touch-sprint action-btn action-bottom"
                    >
                      <span class="btn-label">Sprint</span>
                    </button>
                  </div>
                  <!-- Fin Boutons d’action -->
                </div>
              </div>

              <!-- HUD sur le côté (desktop) / en dessous (mobile) -->
              <aside id="hud"></aside>
            </div>
          </div>

          <!-- ÉCRAN D’ACCUEIL / BOOT (VISIBLE AU DÉBUT) -->
          <div id="boot">
            <div class="boot-header">
              <div class="boot-portrait">
                <img src="./assets/hero1.png" alt="Héros" />
              </div>
              <div class="boot-title">
                <h1>Le Cœur d’Éphéria</h1>
                <p class="tag">
                  « Celui qui cherche la sortie oublie toujours pourquoi il est
                  entré. »
                </p>
              </div>
            </div>

            <section class="hero-select">
              <h2>Choisis ton avatar</h2>
              <div class="grid">
                <button class="hero-card" data-src="./assets/hero1.png">
                  <img src="./assets/hero1.png" alt="Héros" />
                  <span>Lioran — Veilleur du Labyrinthe</span>
                </button>
              </div>
              <button id="startBtn" disabled>Démarrer</button>
            </section>

            <section class="help">
              <h3>Commandes</h3>
              <ul>
                <li>🕹️ Déplacer : ZQSD / ↑←↓→</li>
                <li>💬 Interagir / Lire : E</li>
              </ul>
              <p class="help-note">Sur mobile : Boutons tactiles.</p>
            </section>
          </div>
        </div>
      </div>
    </div>

    <div class="orientation-warning">
      <div class="orientation-message">
        <h2>Tourne ton appareil</h2>
        <p>Ce jeu se joue en mode paysage. Merci de pivoter ton téléphone.</p>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
